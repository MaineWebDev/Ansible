---
- name: Home Lab Configuration Discovery
  hosts: all
  gather_facts: yes

  tasks:
    - name: Display basic system info
      debug:
        msg: 
          - "Host: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"
          - "Memory: {{ ansible_memtotal_mb }} MB"

    - name: Save full configuration to local file inside container
      copy:
        content: "{{ ansible_facts | to_nice_json }}"
        # We save this to the container's /ansible mount
        dest: "/ansible/facts_{{ inventory_hostname }}.json"
      delegate_to: localhost
